name: Update DXcore lock

# Opens a pull request that pins .github/dxcore.lock to a DXcore release.
# Builds keep using the old pin until someone merges that pull request, so
# moving to a new core is still a reviewed change (audit APP-04).
#
# build.yml calls this first on every push to release. When a newer DXcore
# release is out, this opens or updates the pull request and that push is
# not built: merging the pull request is itself a push to release, and that
# one builds the app with the new core. Every pubspec version is uploaded
# once, so it is built with the core it ships with. When the pull request
# for the newest core was closed unmerged, the build uses the pinned core.
#
# It also runs once a day, and by hand for a chosen tag or for dev. An
# automatic run does not reopen a pull request that was closed unmerged;
# run it by hand to do that.

on:
  workflow_call:
    secrets:
      DXCORE_PRIVATE_ACCESS_TOKEN:
        required: true
    outputs:
      build:
        description: "'false' while a pull request for a newer DXcore waits to be merged"
        value: ${{ jobs.update.outputs.build }}
  workflow_dispatch:
    inputs:
      tag:
        description: "DXcore tag, such as r6.2.0. Leave empty for the newest release."
        required: false
        default: ""
      base:
        description: "Branch the pull request goes into"
        type: choice
        options:
          - release
          - dev
        default: release
  schedule:
    - cron: "23 5 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: update-dxcore-lock
      cancel-in-progress: false
    outputs:
      build: ${{ steps.pr.outputs.build || steps.plan.outputs.build }}
    env:
      BASE: ${{ inputs.base || 'release' }}
      GH_REPO: ${{ github.repository }}
      EVENT: ${{ github.event_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.base || 'release' }}

      - name: Choose the DXcore tag
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          DXCORE_TOKEN: ${{ secrets.DXCORE_PRIVATE_ACCESS_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          lock=.github/dxcore.lock

          tag=$INPUT_TAG
          if [ -z "$tag" ]; then
            tag=$(GH_TOKEN=$DXCORE_TOKEN gh api repos/UnboundTechCo/DXcore-private/releases/latest --jq .tag_name)
          fi
          if ! [[ "$tag" =~ ^r[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::error::'$tag' is not a DXcore tag such as r6.2.0"
            exit 1
          fi
          current=$(sed -n 's/^tag=//p' "$lock" | tr -d '\r')
          branch="dxcore-lock/$tag-into-$BASE"
          {
            echo "tag=$tag"
            echo "current=$current"
            echo "branch=$branch"
          } >> "$GITHUB_OUTPUT"

          hashes=$(grep -cE '^DXcore-(android|ios|linux|windows)\.zip=[0-9a-f]{64}$' "$lock" || true)
          if [ "$current" = "$tag" ] && [ "$hashes" = 4 ]; then
            echo "$BASE already pins DXcore $tag."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$EVENT" != workflow_dispatch ] && \
             [ -n "$(gh pr list --head "$branch" --base "$BASE" --state closed --json number --jq '.[].number')" ]; then
            echo "A pull request pinning DXcore $tag into $BASE was closed unmerged, so $BASE stays on $current. Run this workflow by hand to open it again."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Download the release and write the lock
        if: steps.plan.outputs.skip == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.DXCORE_PRIVATE_ACCESS_TOKEN }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: scripts/update_dxcore_lock.sh "$TAG"

      - name: Open the pull request
        id: pr
        if: steps.plan.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
          CURRENT: ${{ steps.plan.outputs.current }}
          BRANCH: ${{ steps.plan.outputs.branch }}
        run: |
          set -euo pipefail
          lock=.github/dxcore.lock
          if git diff --quiet -- "$lock"; then
            echo "$lock on $BASE already holds these hashes."
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add "$lock"
          git commit -m "ci: pin DXcore $TAG" -m "Written by the Update DXcore lock workflow from the $TAG release assets."
          git push --force origin "HEAD:refs/heads/$BRANCH"

          url=$(gh pr list --head "$BRANCH" --base "$BASE" --state open --json url --jq '.[0].url')
          if [ -n "$url" ]; then
            echo "Updated the open pull request $url"
          else
            release=https://github.com/UnboundTechCo/DXcore-private/releases/tag/$TAG
            if [ -n "$CURRENT" ]; then
              changes="Core changes since $CURRENT: https://github.com/UnboundTechCo/DXcore-private/compare/$CURRENT...$TAG"
            else
              changes="The lock pinned no release before."
            fi
            {
              echo "Pins the app to DXcore **$TAG** (currently **${CURRENT:-none}**)."
              echo
              echo "- Release: $release"
              echo "- $changes"
              echo
              echo "\`scripts/update_dxcore_lock.sh\` downloaded the four assets on the runner. Where the release publishes \`SHA256SUMS\`, it checked each hash against that file."
              echo
              echo '```'
              sed -n '/^tag=/,$p' "$lock"
              echo '```'
              echo
              echo "Pushes to \`release\` are not built while this is open. Merging it builds the app with DXcore $TAG. To build with **${CURRENT:-the current pin}** instead, close this pull request and use *Re-run all jobs* on the build that waited."
            } > "$RUNNER_TEMP/pr-body.md"

            url=$(gh pr create --base "$BASE" --head "$BRANCH" \
              --title "ci: pin DXcore $TAG" \
              --body-file "$RUNNER_TEMP/pr-body.md")
            echo "Opened $url"
          fi

          echo "build=false" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = push ]; then
            msg="DXcore $TAG is out and $BASE pins ${CURRENT:-nothing}, so this push is not built. Merge $url to build it with $TAG, or close it and use Re-run all jobs here to build with ${CURRENT:-the current pin}."
            echo "::notice title=Build waits for DXcore $TAG::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          fi
