on:
  workflow_call:

jobs:
  googleplay:
    if: ${{ github.event.inputs.upload_to_app_store != 'true' }}
    runs-on: ubuntu-24.04
    outputs:
      app_version: ${{ steps.get_version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Accept Android SDK licenses
        run: yes | sudo "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses

      - name: Install NDK 29
        run: |
          yes | sudo "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "ndk;29.0.13846066"

      - name: Force Gradle to use NDK 29 (absolute override)
        run: |
          rm -f android/local.properties
          echo "ndk.dir=${ANDROID_HOME}/ndk/29.0.13846066" > android/local.properties
          echo "ndkVersion=29.0.13846066" >> android/local.properties

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.6"
          channel: "stable"
          architecture: "x64"
          cache: false

      - name: Verify Flutter version
        run: |
          flutter --version
          dart --version
          flutter doctor --verbose

      - name: Clean all caches and build artifacts
        run: |
          flutter clean
          rm -rf build/
          rm -rf ~/.gradle
          rm -rf android/.gradle
          rm -rf android/build/
          rm -rf android/app/build/
          rm -rf .dart_tool/
          echo "✅ All caches cleaned"

      - name: Get dependencies
        run: flutter pub get

      - name: Get app version
        id: get_version
        uses: ./.github/actions/get-version

      - name: Download DXcore-android.zip
        uses: ./.github/actions/fetch-dxcore
        with:
          asset: DXcore-android.zip
          path: DXcore-android.zip
          token: ${{ secrets.DXCORE_PRIVATE_ACCESS_TOKEN }}

      - name: Unpack Android Framework
        run: |
          mkdir -p android/app/libs
          unzip -o DXcore-android.zip -d android/app/libs
          mv android/app/libs/build/android/* android/app/libs/
          rm -rf android/app/libs/build DXcore-android.zip

      - name: Generate .env
        uses: ./.github/actions/create-env
        with:
          secret_blob: ${{ toJson(secrets) }}
          var_blob: ${{ toJson(vars) }}
          os_name: "android"

      - name: Create key.properties for Android signing
        run: |
          echo "storePassword=${{ secrets.STORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=keystore.jks" >> android/key.properties

      - name: Decode and save Android keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks

      - name: Build AAB for Google Play
        run: |
          chmod +x scripts/build_release.sh
          bash scripts/build_release.sh <<EOF
          2
          3
          4
          EOF

      - name: Attest build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: build/app/outputs/bundle/release/app-release.aab

      - name: Upload AAB artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-googleplay
          path: build/app/outputs/bundle/release/app-release.aab

  github:
    if: ${{ github.event.inputs.upload_to_app_store != 'true' }}
    runs-on: ubuntu-24.04
    outputs:
      app_version: ${{ steps.get_version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Accept Android SDK licenses
        run: yes | sudo "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses

      - name: Install NDK 29
        run: |
          yes | sudo "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "ndk;29.0.13846066"

      - name: Force Gradle to use NDK 29 (absolute override)
        run: |
          rm -f android/local.properties
          echo "ndk.dir=${ANDROID_HOME}/ndk/29.0.13846066" > android/local.properties
          echo "ndkVersion=29.0.13846066" >> android/local.properties

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.6"
          channel: "stable"
          architecture: "x64"
          cache: false

      - name: Verify Flutter version
        run: |
          flutter --version
          dart --version
          flutter doctor --verbose

      - name: Clean all caches and build artifacts
        run: |
          flutter clean
          rm -rf build/
          rm -rf ~/.gradle
          rm -rf android/.gradle
          rm -rf android/build/
          rm -rf android/app/build/
          rm -rf .dart_tool/
          echo "✅ All caches cleaned"

      - name: Get dependencies
        run: flutter pub get

      - name: Get app version
        id: get_version
        uses: ./.github/actions/get-version

      - name: Download DXcore-android.zip
        uses: ./.github/actions/fetch-dxcore
        with:
          asset: DXcore-android.zip
          path: DXcore-android.zip
          token: ${{ secrets.DXCORE_PRIVATE_ACCESS_TOKEN }}

      - name: Unpack Android Framework
        run: |
          mkdir -p android/app/libs
          unzip -o DXcore-android.zip -d android/app/libs
          mv android/app/libs/build/android/* android/app/libs/
          rm -rf android/app/libs/build DXcore-android.zip

      - name: Generate .env
        uses: ./.github/actions/create-env
        with:
          secret_blob: ${{ toJson(secrets) }}
          var_blob: ${{ toJson(vars) }}
          os_name: "android"
      - name: Create key.properties for Android signing
        run: |
          echo "storePassword=${{ secrets.STORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=keystore.jks" >> android/key.properties

      - name: Decode and save Android keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks

      - name: Build APKs for GitHub
        run: |
          chmod +x scripts/build_release.sh
          bash scripts/build_release.sh <<EOF
          2
          4
          4
          EOF

      - name: Rename Android APKs
        run: |
          shopt -s nullglob

          for file in build/app/outputs/flutter-apk/DefyxVPN-*.apk; do
            dir=$(dirname "$file")
            filename=$(basename "$file")

            newname=$(echo "$filename" | sed -E 's/^DefyxVPN-[0-9]+\.[0-9]+\.[0-9]+-(.+)\.apk$/DefyxVPN-Android-\1.apk/')

            mv "$file" "$dir/$newname"
          done
      - name: Attest build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: build/app/outputs/flutter-apk/DefyxVPN-*.apk

      - name: Upload APKs artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-github
          path: build/app/outputs/flutter-apk/DefyxVPN-*.apk
