name: Build iOS

on:
  workflow_call:

jobs:
  build-ios:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.6"

      - name: Download DXcore-ios.zip
        uses: ./.github/actions/fetch-dxcore
        with:
          asset: DXcore-ios.zip
          path: DXcore-ios.zip
          token: ${{ secrets.DXCORE_PRIVATE_ACCESS_TOKEN }}

      - name: Unpack iOS Framework
        run: |
          mkdir -p ios/Frameworks
          unzip -o DXcore-ios.zip -d ios
          mv ios/build/ios/* ios/
          rm -rf ios/build DXcore-ios.zip
          ls -la ios

      - name: Get app version
        id: get_version
        uses: ./.github/actions/get-version

      - name: Generate .env
        uses: ./.github/actions/create-env
        with:
          secret_blob: ${{ toJson(secrets) }}
          var_blob: ${{ toJson(vars) }}
          os_name: "ios"

      - name: Import iOS certificates
        uses: apple-actions/import-codesign-certs@63fff01cd422d4b7b855d40ca1e9d34d2de9427d # v3
        with:
          p12-file-base64: ${{ secrets.IOS_CERTIFICATE_P12 }}
          p12-password: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          keychain-password: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}

      - name: Install provisioning profiles
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "${{ secrets.IOS_PROVISION_MAIN }}"   | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/main.mobileprovision
          echo "${{ secrets.IOS_PROVISION_TUNNEL }}" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/tunnel.mobileprovision

      - name: Build Flutter IPA (signed by Xcode)
        run: |
          chmod +x scripts/build_release.sh
          bash scripts/build_release.sh <<EOF
          2
          2
          4
          EOF

      - name: Fix Signing (Apply identity + team)
        run: |
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -allowProvisioningUpdates \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            CODE_SIGN_IDENTITY="${{ secrets.IOS_CODE_SIGN_IDENTITY }}"

      - name: Upload IPA to TestFlight
        uses: apple-actions/upload-testflight-build@54dc215b4cd5529730db39f11c84efdb71414e07 # v1
        with:
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-issuer-id: ${{ secrets.APPSTORE_API_KEY_ISSUER }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          app-path: build/ios/ipa/*.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-release
          path: build/ios/ipa/*.ipa
