on:
  workflow_call:
  
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 

      - name: Get app version
        id: get_version
        uses: ./.github/actions/get-version

      - name: Create tag if not exists
        id: create_tag
        run: |
          TAG="v${{ steps.get_version.outputs.version }}"
          echo "Detected tag: $TAG"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists. Skipping."
            echo "created=false" >> $GITHUB_OUTPUT
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "$TAG"
            git push origin "$TAG"
            echo "created=true" >> $GITHUB_OUTPUT
            echo "✅ Created and pushed tag $TAG"
          fi

      - name: Prepare Release Message
        if: steps.create_tag.outputs.created == 'true'
        run: |
          sed "s|RELEASE_TAG|v${{ steps.get_version.outputs.version }}|g" \
            .github/release_message.md >> release.md

      - name: Download Android Google Play artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-googleplay
          path: android-release/

      - name: Download Android GitHub artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-github
          path: android-release/

      # Kept out of android-release/, whose AABs go to the phone tracks.
      - name: Download Android TV Google Play artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-googleplay-tv
          path: android-tv-release/

      - name: Download Windows artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-release
          path: windows-release/
      
      - name: Download Linux artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-release
          path: linux-release/

      - name: Create GitHub Release
        if: steps.create_tag.outputs.created == 'true'
        id: create_release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: "v${{ steps.get_version.outputs.version }}"
          name: "v${{ steps.get_version.outputs.version }}"
          draft: true
          files: |
            android-release/**/*.apk
            windows-release/**
            linux-release/**
          body_path: release.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete existing release assets
        if: steps.create_tag.outputs.created == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: "v${{ steps.get_version.outputs.version }}"
        run: |
          set -euo pipefail
          # Fails when the tag has no release, or the release has no assets.
          assets=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          if [ -z "$assets" ]; then
            echo "::error::Release $TAG has no assets to delete"
            exit 1
          fi
          while IFS= read -r asset; do
            gh release delete-asset "$TAG" "$asset" --yes
          done <<< "$assets"

      - name: Update GitHub Release
        if: steps.create_tag.outputs.created == 'false'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: "v${{ steps.get_version.outputs.version }}"
          name: "v${{ steps.get_version.outputs.version }}"
          # v2.5+ publishes a reused draft unless this is true. An already
          # published release stays published.
          draft: true
          files: |
            android-release/**/*.apk
            windows-release/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload AAB to Google Play Store
        if: steps.create_tag.outputs.created == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: de.unboundtech.defyxvpn
          releaseFiles: android-release/**/*.aab
          tracks: internal
          status: draft

      # Android TV uses Play's dedicated TV tracks, which only take the TV
      # bundle (leanback required). The Play API names TV internal testing
      # tv:internal; there is no tv:qa track.
      - name: Upload Android TV AAB to Google Play Store
        if: steps.create_tag.outputs.created == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: de.unboundtech.defyxvpn
          releaseFiles: android-tv-release/app-tv-release.aab
          tracks: "tv:internal"
          status: draft

      # TestFlight uploads run in ios.yml, which has the macOS runner they need.