on:
  workflow_call:

jobs:
  github:
    runs-on: windows-2022
    outputs:
      app_version: ${{ steps.get_version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.2"
          channel: "stable"
          architecture: "x64"

      - name: Verify Flutter version
        run: |
          flutter --version
          dart --version
          flutter doctor --verbose

      - name: Get dependencies
        run: flutter pub get

      - name: Get app version
        id: get_version
        uses: ./.github/actions/get-version

      - name: Generate .env
        uses: ./.github/actions/create-env
        with:
          secret_blob: ${{ toJson(secrets) }}
          var_blob: ${{ toJson(vars) }}
          os_name: "windows"

      - name: Download Windows Framework
        env:
          GITHUB_TOKEN: ${{ secrets.DXCORE_PRIVATE_ACCESS_TOKEN }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "windows/runner" | Out-Null
          $release = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/UnboundTechCo/DXcore-private/releases/latest" `
            -Headers @{ Authorization = "token $env:GITHUB_TOKEN" }
          $asset = $release.assets | Where-Object { $_.name -eq "DXcore-windows.zip" }
          $asset_id = $asset.id
          Invoke-WebRequest `
            -Uri "https://api.github.com/repos/UnboundTechCo/DXcore-private/releases/assets/$asset_id" `
            -Headers @{ Authorization = "token $env:GITHUB_TOKEN"; Accept = "application/octet-stream" } `
            -OutFile "DXcore-windows.zip"
          Expand-Archive -Path "DXcore-windows.zip" -DestinationPath "windows/runner" -Force
          Move-Item "windows/runner/build/windows/*" "windows/runner/" -Force
          Remove-Item "DXcore-windows.zip"
          Get-ChildItem -Recurse "windows/runner"

      - name: Enable Windows Desktop support
        run: flutter config --enable-windows-desktop

      - name: Build Windows Release
        shell: bash
        run: flutter build windows --release

      - name: Zip Windows Release Output
        shell: pwsh
        run: |
          $source = "build/windows/x64/runner/Release"
          $zipPath = "build/windows/DefyxVPN-Windows-Portable-x64.zip"
          if (Test-Path $zipPath) { Remove-Item $zipPath }
          Compress-Archive -Path "$source\*" -DestinationPath $zipPath

      - name: Build Windows Installer
        shell: pwsh
        run: |
          $pubspec = Get-Content "pubspec.yaml" -Raw
          $versionMatch = [regex]::Match($pubspec, '(?m)^version:\s*(\d+\.\d+\.\d+)\+(\d+)\s*$')
          if (-not $versionMatch.Success) {
            throw "Could not find a Flutter version in pubspec.yaml"
          }

          $releaseDirectory = (Resolve-Path "build/windows/x64/runner/Release").Path
          $appExecutable = Join-Path $releaseDirectory "DefyxVPN.exe"
          if (-not (Test-Path $appExecutable)) {
            throw "Flutter Windows executable was not generated: $appExecutable"
          }

          $version = $versionMatch.Groups[0].Value.Split(':', 2)[1].Trim()
          $versionInfo = $version -replace '\+', '.'
          $installerDirectory = Join-Path (Resolve-Path "build/windows").Path "installer"
          New-Item -ItemType Directory -Force -Path $installerDirectory | Out-Null

          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler was not found: $iscc"
          }
          & $iscc "/DMyAppVersion=$version" "/DMyAppVersionInfo=$versionInfo" "/DMyAppSourceDir=$releaseDirectory" "/DMyAppOutputDir=$installerDirectory" "windows/installer/defyx_vpn.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup compilation failed"
          }

          $installer = Join-Path $installerDirectory "DefyxVPN-Windows-Installer-x64.exe"
          if (-not (Test-Path $installer)) {
            throw "Installer was not generated: $installer"
          }

      - name: Upload Windows Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            build/windows/DefyxVPN-Windows-Portable-x64.zip
            build/windows/installer/DefyxVPN-Windows-Installer-x64.exe
