name: "iOS App Store signing"
description: >
  Sets up manual App Store signing for the iOS build. The Xcode project in git
  keeps automatic signing for local builds, which needs an Apple account a
  runner does not have. This imports the distribution certificate into a
  temporary keychain, installs the App Store provisioning profiles, switches
  the targets they are for to manual signing, and writes the export options
  for flutter build ipa.

inputs:
  certificate-base64:
    description: "Apple Distribution certificate and private key, a base64 .p12"
    required: true
  certificate-password:
    description: "Password of the .p12"
    required: true
  app-profile-base64:
    description: "App Store provisioning profile of the app, base64"
    required: true
  extension-profile-base64:
    description: "App Store provisioning profile of the PacketTunnel extension, base64"
    required: true
  project:
    description: "The Xcode project to switch to manual signing"
    required: false
    default: "ios/Runner.xcodeproj"
  configuration:
    description: "The build configuration to switch"
    required: false
    default: "Release"

outputs:
  export-options:
    description: "Path of the ExportOptions.plist to pass to flutter build ipa"
    value: ${{ steps.profiles.outputs.export-options }}

runs:
  using: composite
  steps:
    # As in GitHub's guide to signing Xcode apps on macOS runners.
    - name: Import the certificate into a temporary keychain
      id: keychain
      shell: bash
      env:
        CERTIFICATE_BASE64: ${{ inputs.certificate-base64 }}
        CERTIFICATE_PASSWORD: ${{ inputs.certificate-password }}
      run: |
        set -euo pipefail
        keychain="$RUNNER_TEMP/app-signing.keychain-db"
        keychain_password=$(openssl rand -base64 32)
        certificate="$RUNNER_TEMP/certificate.p12"
        trap 'rm -f "$certificate"' EXIT

        printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$certificate"
        security create-keychain -p "$keychain_password" "$keychain"
        security set-keychain-settings -lut 21600 "$keychain"
        security unlock-keychain -p "$keychain_password" "$keychain"
        security import "$certificate" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
        security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" > /dev/null
        # Search the new keychain first, keeping the ones already listed.
        security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
        echo "keychain=$keychain" >> "$GITHUB_OUTPUT"

    - name: Install the profiles and switch to manual signing
      id: profiles
      shell: bash
      env:
        APP_PROFILE_BASE64: ${{ inputs.app-profile-base64 }}
        EXTENSION_PROFILE_BASE64: ${{ inputs.extension-profile-base64 }}
        KEYCHAIN: ${{ steps.keychain.outputs.keychain }}
        PROJECT: ${{ inputs.project }}
        CONFIGURATION: ${{ inputs.configuration }}
      run: |
        set -euo pipefail
        profiles="$RUNNER_TEMP/profiles"
        mkdir -p "$profiles"
        printf '%s' "$APP_PROFILE_BASE64" | base64 --decode > "$profiles/app.mobileprovision"
        printf '%s' "$EXTENSION_PROFILE_BASE64" | base64 --decode > "$profiles/extension.mobileprovision"

        export_options="$RUNNER_TEMP/ExportOptions.plist"
        python3 "$GITHUB_ACTION_PATH/signing.py" \
          --keychain "$KEYCHAIN" \
          --project "$PROJECT" \
          --configuration "$CONFIGURATION" \
          --export-options "$export_options" \
          "$profiles/app.mobileprovision" \
          "$profiles/extension.mobileprovision"
        echo "export-options=$export_options" >> "$GITHUB_OUTPUT"
